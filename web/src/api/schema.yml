openapi: 3.0.3
info:
  title: FORGE API
  version: 0.1.0
  description: |-
    FORGE -- a student project, collaboration and practical experience ecosystem, powered by the Open University of Kenya.

    FORGE awards no academic credit and issues nothing that could be mistaken for a University qualification. It complements the Learning Management System; it does not duplicate it.
paths:
  /api/v1/accounts/accept-invitation/:
    get:
      operationId: accounts_accept_invitation_retrieve
      description: |-
        Look at an invitation, then accept it.

        GET shows who invited you and in what capacity, without consuming the
        token — nobody should have to commit to an account before seeing what they
        are being asked to join. POST creates the account and emails its
        credentials, exactly as open registration does.
      tags:
      - accounts
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
          description: ''
    post:
      operationId: accounts_accept_invitation_create
      description: |-
        Look at an invitation, then accept it.

        GET shows who invited you and in what capacity, without consuming the
        token — nobody should have to commit to an account before seeing what they
        are being asked to join. POST creates the account and emails its
        credentials, exactly as open registration does.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '202':
          description: No response body
  /api/v1/accounts/admin/email-log/:
    get:
      operationId: accounts_admin_email_log_list
      description: |-
        What the platform has tried to send.

        Exists so that "the email never arrived" has an answer. Stewards only, and
        no message body is stored — verification links and generated passwords
        pass through this path.
      parameters:
      - in: query
        name: category
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - failed
          - pending
          - sent
        description: |-
          * `pending` - Pending
          * `sent` - Accepted by the mail server
          * `failed` - Failed
      - in: query
        name: template
        schema:
          type: string
      tags:
      - accounts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEmailLogList'
          description: ''
  /api/v1/accounts/admin/email-log/{id}/:
    get:
      operationId: accounts_admin_email_log_retrieve
      description: |-
        What the platform has tried to send.

        Exists so that "the email never arrived" has an answer. Stewards only, and
        no message body is stored — verification links and generated passwords
        pass through this path.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this email log.
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailLog'
          description: ''
  /api/v1/accounts/admin/members/:
    get:
      operationId: accounts_admin_members_list
      description: |-
        The member directory as a steward sees it.

        Carries the fields the ordinary directory withholds — email address,
        status, last seen, roles held — because managing access without them is
        guesswork. Restricted accordingly, and every action it offers writes to
        the audit log.
      parameters:
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - alumnus
          - external
          - staff
          - student
        description: |-
          * `student` - Student
          * `staff` - Academic or administrative staff
          * `alumnus` - Alumnus
          * `external` - External mentor or partner
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: programme
        schema:
          type: string
          format: uuid
      - in: query
        name: school
        schema:
          type: string
          format: uuid
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - alumnus
          - closed
          - pending
          - suspended
        description: |-
          * `pending` - Pending email verification
          * `active` - Active
          * `alumnus` - Graduated or deprovisioned
          * `suspended` - Suspended
          * `closed` - Closed at the member's request
      tags:
      - accounts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMeList'
          description: ''
  /api/v1/accounts/admin/members/{public_slug}/:
    get:
      operationId: accounts_admin_members_retrieve
      description: |-
        The member directory as a steward sees it.

        Carries the fields the ordinary directory withholds — email address,
        status, last seen, roles held — because managing access without them is
        guesswork. Restricted accordingly, and every action it offers writes to
        the audit log.
      parameters:
      - in: path
        name: public_slug
        schema:
          type: string
          description: 'The stable address of your public portfolio. Choose carefully:
            changing it breaks links you have already shared.'
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/accounts/admin/members/{public_slug}/reinstate/:
    post:
      operationId: accounts_admin_members_reinstate_create
      description: |-
        The member directory as a steward sees it.

        Carries the fields the ordinary directory withholds — email address,
        status, last seen, roles held — because managing access without them is
        guesswork. Restricted accordingly, and every action it offers writes to
        the audit log.
      parameters:
      - in: path
        name: public_slug
        schema:
          type: string
          description: 'The stable address of your public portfolio. Choose carefully:
            changing it breaks links you have already shared.'
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/accounts/admin/members/{public_slug}/reset-password/:
    post:
      operationId: accounts_admin_members_reset_password_create
      description: |-
        Issue a fresh generated password and email it.

        The platform has no self-service password reset, on purpose: a reset
        link is a second credential travelling by email, and the account can
        already be recovered through the same mailbox. A steward doing it
        leaves an audit row naming who asked and who acted.
      parameters:
      - in: path
        name: public_slug
        schema:
          type: string
          description: 'The stable address of your public portfolio. Choose carefully:
            changing it breaks links you have already shared.'
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/accounts/admin/members/{public_slug}/suspend/:
    post:
      operationId: accounts_admin_members_suspend_create
      description: |-
        Suspend an account.

        Separate from moderation's suspension, which attaches to a report and
        a rationale. This is the administrative lever for an account that has
        to be stopped now — it still records who did it and why.
      parameters:
      - in: path
        name: public_slug
        schema:
          type: string
          description: 'The stable address of your public portfolio. Choose carefully:
            changing it breaks links you have already shared.'
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/accounts/admin/members/{public_slug}/unlock/:
    post:
      operationId: accounts_admin_members_unlock_create
      description: Clear a sign-in lockout without changing the password.
      parameters:
      - in: path
        name: public_slug
        schema:
          type: string
          description: 'The stable address of your public portfolio. Choose carefully:
            changing it breaks links you have already shared.'
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/accounts/admin/overview/:
    get:
      operationId: accounts_admin_overview_retrieve
      description: One call for the administration console's summary row.
      tags:
      - accounts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/accounts/invitations/:
    get:
      operationId: accounts_invitations_list
      description: |-
        Inviting people who cannot use the open route.

        Restricted to stewards. Students with a University address register
        directly and are never invited; this is for staff, alumni returning to
        mentor, and external partners, whose accounts skip the domain check.
      parameters:
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - alumnus
          - external
          - staff
          - student
        description: |-
          What sort of account this creates. Anything other than 'student' is exempt from the University domain check, which is the whole reason invitations exist.

          * `student` - Student
          * `staff` - Academic or administrative staff
          * `alumnus` - Alumnus
          * `external` - External mentor or partner
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - accepted
          - expired
          - pending
          - revoked
        description: |-
          * `pending` - Pending
          * `accepted` - Accepted
          * `revoked` - Revoked
          * `expired` - Expired
      tags:
      - accounts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInvitationList'
          description: ''
    post:
      operationId: accounts_invitations_create
      description: |-
        Inviting people who cannot use the open route.

        Restricted to stewards. Students with a University address register
        directly and are never invited; this is for staff, alumni returning to
        mentor, and external partners, whose accounts skip the domain check.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
  /api/v1/accounts/invitations/{id}/:
    get:
      operationId: accounts_invitations_retrieve
      description: |-
        Inviting people who cannot use the open route.

        Restricted to stewards. Students with a University address register
        directly and are never invited; this is for staff, alumni returning to
        mentor, and external partners, whose accounts skip the domain check.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this invitation.
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
    delete:
      operationId: accounts_invitations_destroy
      description: |-
        Inviting people who cannot use the open route.

        Restricted to stewards. Students with a University address register
        directly and are never invited; this is for staff, alumni returning to
        mentor, and external partners, whose accounts skip the domain check.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this invitation.
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/accounts/invitations/{id}/resend/:
    post:
      operationId: accounts_invitations_resend_create
      description: |-
        Inviting people who cannot use the open route.

        Restricted to stewards. Students with a University address register
        directly and are never invited; this is for staff, alumni returning to
        mentor, and external partners, whose accounts skip the domain check.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this invitation.
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/accounts/me/:
    get:
      operationId: accounts_me_retrieve
      tags:
      - accounts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: accounts_me_partial_update
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/accounts/me/data/:
    get:
      operationId: accounts_me_data_retrieve
      description: |-
        Data subject rights, Data Protection Act 2019.

        GET returns everything the platform holds about the caller. DELETE erases
        their personal data while leaving other members' confirmed records intact
        -- see accounts.services.erase_user for why that boundary is where it is.
      tags:
      - accounts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: accounts_me_data_destroy
      description: |-
        Data subject rights, Data Protection Act 2019.

        GET returns everything the platform holds about the caller. DELETE erases
        their personal data while leaving other members' confirmed records intact
        -- see accounts.services.erase_user for why that boundary is where it is.
      tags:
      - accounts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/accounts/me/password/:
    post:
      operationId: accounts_me_password_create
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
