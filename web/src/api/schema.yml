            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
  /api/v1/accounts/members/suggested-roles/:
    get:
      operationId: accounts_members_suggested_roles_list
      description: |-
        Open roles that fit the caller.

        The most common way a voluntary platform dies is that a willing
        student cannot find the thing they would gladly have done.
      parameters:
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - alumnus
          - external
          - staff
          - student
        description: |-
          * `student` - Student
          * `staff` - Academic or administrative staff
          * `alumnus` - Alumnus
          * `external` - External mentor or partner
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: programme
        schema:
          type: string
          format: uuid
      - in: query
        name: school
        schema:
          type: string
          format: uuid
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - accounts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRoleSuggestionList'
          description: ''
  /api/v1/accounts/my-skills/:
