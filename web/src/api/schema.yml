      required:
      - download_count
      - downloads
      - id
      - is_valid
      - issued_at
      - kind
      - kind_display
      - last_downloaded_at
      - ledger_head
      - project_title
      - recipient_name
      - statement
      - verification_code
    CertificateDownload:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        downloaded_by_name:
          type: string
          readOnly: true
          description: Denormalised so the trail survives the account being erased.
        was_holder:
          type: boolean
          readOnly: true
          description: False when a steward took a copy on the member's behalf.
        downloaded_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - downloaded_at
      - downloaded_by_name
      - id
      - was_holder
    CertificateKindEnum:
      enum:
      - participation
      - completion
      - mentorship
      - community
      type: string
      description: |-
        * `participation` - Participation in a project
        * `completion` - Completion of a delivered project
        * `mentorship` - Mentorship
        * `community` - Community contribution
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 10
      required:
      - current_password
      - new_password
    Contribution:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project:
          type: string
          format: uuid
        project_title:
          type: string
          readOnly: true
        contributor:
          allOf:
          - $ref: '#/components/schemas/PublicUser'
          readOnly: true
        dimension:
          $ref: '#/components/schemas/DimensionEnum'
        dimension_display:
          type: string
          readOnly: true
        description:
          type: string
          description: What you did, specifically enough that your lead and mentor
            can recognise it. 'Worked on the backend' is not a contribution record;
            'built and tested the contribution ledger, including the hash chain' is.
          maxLength: 2000
        evidence_url:
          type: string
          format: uri
          description: 'A link to the work itself: a commit, a pull request, a document,
            a recording. Optional but it makes confirmation quick.'
          maxLength: 200
        effort_hours:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,1})?$
          nullable: true
          description: Approximate. Used for your own record, not for ranking.
        occurred_on:
          type: string
          format: date
        milestone:
          type: string
          format: uuid
          nullable: true
        skills_used:
          type: array
          items:
            $ref: '#/components/schemas/Skill'
          readOnly: true
        ai_assistance:
          $ref: '#/components/schemas/AiAssistanceEnum'
        ai_assistance_note:
          type: string
          maxLength: 300
        status:
          allOf:
          - $ref: '#/components/schemas/ContributionStatusEnum'
          readOnly: true
        attestations:
          type: array
          items:
            $ref: '#/components/schemas/Attestation'
          readOnly: true
        is_late:
          type: boolean
          readOnly: true
        ledger_sequence:
          type: integer
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        settled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attestations
      - contributor
      - created_at
      - description
      - dimension
      - dimension_display
      - id
      - is_late
      - ledger_sequence
      - project
      - project_title
      - settled_at
      - skills_used
      - status
      - submitted_at
    ContributionRequest:
      type: object
      properties:
        project:
          type: string
          format: uuid
        dimension:
          $ref: '#/components/schemas/DimensionEnum'
        description:
          type: string
          minLength: 1
          description: What you did, specifically enough that your lead and mentor
            can recognise it. 'Worked on the backend' is not a contribution record;
            'built and tested the contribution ledger, including the hash chain' is.
          maxLength: 2000
        evidence_url:
          type: string
          format: uri
          description: 'A link to the work itself: a commit, a pull request, a document,
            a recording. Optional but it makes confirmation quick.'
          maxLength: 200
        effort_hours:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,1})?$
          nullable: true
          description: Approximate. Used for your own record, not for ranking.
        occurred_on:
          type: string
          format: date
        milestone:
          type: string
          format: uuid
          nullable: true
        skill_ids:
          type: array
          items:
            type: string
            format: uuid
            writeOnly: true
          writeOnly: true
        ai_assistance:
          $ref: '#/components/schemas/AiAssistanceEnum'
        ai_assistance_note:
          type: string
          maxLength: 300
      required:
      - description
      - dimension
      - project
    ContributionStatusEnum:
      enum:
      - draft
      - submitted
      - confirmed
      - disputed
      - withdrawn
      type: string
      description: |-
        * `draft` - Draft
        * `submitted` - Awaiting confirmation
        * `confirmed` - Confirmed
        * `disputed` - Disputed
        * `withdrawn` - Withdrawn
    CreateInvitationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        full_name:
          type: string
          maxLength: 160
        kind:
          allOf:
          - $ref: '#/components/schemas/UserKindEnum'
          default: student
        role:
          default: ''
          oneOf:
          - $ref: '#/components/schemas/RoleEnum'
          - $ref: '#/components/schemas/BlankEnum'
        discipline_area_id:
          type: string
          format: uuid
          nullable: true
        message:
          type: string
          maxLength: 1000
      required:
      - email
    DigestFrequencyEnum:
      enum:
      - immediate
      - daily
      - weekly
      - 'off'
      type: string
      description: |-
        * `immediate` - Email me as things happen
        * `daily` - One email a day
        * `weekly` - One email a week
        * `off` - No email -- I will check the site
    DimensionEnum:
      enum:
      - delivery
      - review
      - documentation
      - mentorship
      - community
      - leadership
      - research
      - design
      type: string
      description: |-
        * `delivery` - Delivery -- work completed against an objective
        * `review` - Review -- checking and improving others' work
        * `documentation` - Documentation -- writing it down for others
        * `mentorship` - Mentorship -- teaching and supporting others
        * `community` - Community -- answering, organising, moderating
        * `leadership` - Leadership -- coordinating a team to a result
        * `research` - Research -- investigation, field work, analysis
        * `design` - Design -- interface, service or visual design
    DisciplineArea:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 120
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
      required:
      - id
      - name
      - slug
    DisciplineAreaRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          minLength: 1
          maxLength: 120
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
      required:
      - name
      - slug
    EmailLog:
      type: object
      description: |-
        A record of one attempted send.

        No message body, deliberately: verification links and generated passwords
        pass through this path, and a table holding them would be a better target
        than the password hashes it sits beside.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        to_address:
          type: string
          format: email
          readOnly: true
        subject:
          type: string
          readOnly: true
        template:
          type: string
          readOnly: true
        category:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/EmailLogStatusEnum'
          readOnly: true
        status_display:
          type: string
          readOnly: true
        member:
          type: string
          readOnly: true
        sent_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        error:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category
      - created_at
      - error
      - id
      - member
      - sent_at
      - status
      - status_display
      - subject
      - template
      - to_address
    EmailLogStatusEnum:
      enum:
      - pending
      - sent
      - failed
      type: string
      description: |-
        * `pending` - Pending
        * `sent` - Accepted by the mail server
        * `failed` - Failed
    ForgeTokenObtainPairRequest:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
