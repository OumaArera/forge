        issued_at:
          type: string
          format: date-time
          readOnly: true
        is_valid:
          type: boolean
          readOnly: true
        download_count:
          type: integer
          readOnly: true
        last_downloaded_at:
          type: string
          format: date-time
          readOnly: true
        downloads:
          type: array
          items:
            $ref: '#/components/schemas/CertificateDownload'
