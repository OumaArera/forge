                $ref: '#/components/schemas/UserSkill'
          description: ''
  /api/v1/accounts/my-skills/{id}/:
    get:
      operationId: accounts_my_skills_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user skill.
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      - cookieAuth: []
