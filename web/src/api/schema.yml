          $ref: '#/components/schemas/RoleEnum'
        discipline_area_id:
          type: string
          format: uuid
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        note:
          type: string
          maxLength: 255
      required:
      - role
      - user_id
    HandoverRequest:
      type: object
      properties:
        to_user_id:
          type: string
          format: uuid
        note:
          type: string
          maxLength: 500
      required:
      - to_user_id
    Invitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        full_name:
          type: string
          maxLength: 160
        kind:
          allOf:
          - $ref: '#/components/schemas/UserKindEnum'
          description: |-
            What sort of account this creates. Anything other than 'student' is exempt from the University domain check, which is the whole reason invitations exist.

            * `student` - Student
