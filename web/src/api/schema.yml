components:
  schemas:
    AcceptInvitationRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
        full_name:
          type: string
          maxLength: 160
        programme_id:
          type: string
          format: uuid
          nullable: true
        year_of_study:
          type: integer
          maximum: 9
          minimum: 1
          nullable: true
        public_slug:
          type: string
          maxLength: 40
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - token
    Acceptance:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        document:
          type: string
          maxLength: 40
        version:
          type: string
          maxLength: 16
        text_digest:
          type: string
          readOnly: true
          description: SHA-256 of the exact text accepted.
        accepted_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - accepted_at
      - id
      - text_digest
      - version
    AcceptanceRequest:
      type: object
      properties:
        document:
          type: string
          minLength: 1
          maxLength: 40
        version:
          type: string
          minLength: 1
          maxLength: 16
      required:
      - version
    ActionEnum:
      enum:
      - note
      - warn
      - remove_content
      - lock_thread
      - suspend
      - remove_from_project
      - refer_to_university
      type: string
      description: |-
        * `note` - Note on file, no action
        * `warn` - Warning issued
        * `remove_content` - Content removed
        * `lock_thread` - Thread locked
        * `suspend` - Member suspended
        * `remove_from_project` - Removed from a project
        * `refer_to_university` - Referred to the University
    AiAssistanceEnum:
      enum:
      - none
      - assisted
      - generated
      type: string
      description: |-
        * `none` - No AI assistance
        * `assisted` - AI-assisted, reviewed and understood by me
        * `generated` - Substantially AI-generated, curated by me
    Announcement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        body:
          type: string
          readOnly: true
        author:
          allOf:
          - $ref: '#/components/schemas/PublicUser'
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - author
      - body
      - expires_at
      - id
      - published_at
      - title
    Application:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project:
          type: string
          format: uuid
          readOnly: true
        project_title:
          type: string
          readOnly: true
        role:
          type: string
          format: uuid
        role_title:
          type: string
          readOnly: true
        applicant:
          allOf:
          - $ref: '#/components/schemas/PublicUser'
          readOnly: true
        statement:
          type: string
          description: Why this role, and what you would bring to it. Two paragraphs
            is plenty.
          maxLength: 1500
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        decision_note:
          type: string
          readOnly: true
          description: Required when declining. A student who is turned down without
            a reason learns nothing and is less likely to apply again.
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - applicant
      - created_at
      - decided_at
      - decision_note
      - id
      - project
      - project_title
      - role
      - role_title
      - statement
      - status
    ApplicationDecisionRequest:
      type: object
      properties:
        accept:
          type: boolean
        note:
          type: string
          maxLength: 1000
      required:
      - accept
    ApplicationRequest:
      type: object
      properties:
        role:
          type: string
          format: uuid
        statement:
          type: string
          minLength: 1
          description: Why this role, and what you would bring to it. Two paragraphs
            is plenty.
          maxLength: 1500
      required:
      - role
      - statement
    ApplicationStatusEnum:
      enum:
      - pending
      - accepted
      - declined
      - withdrawn
      type: string
      description: |-
        * `pending` - Pending
        * `accepted` - Accepted
        * `declined` - Declined
        * `withdrawn` - Withdrawn
    AttestRequestRequest:
      type: object
      properties:
        confirm:
          type: boolean
        note:
          type: string
          maxLength: 1000
      required:
      - confirm
    Attestation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        attestor_name:
          type: string
          readOnly: true
        capacity:
          allOf:
          - $ref: '#/components/schemas/CapacityEnum'
          readOnly: true
        capacity_display:
          type: string
          readOnly: true
        decision:
          allOf:
          - $ref: '#/components/schemas/AttestationDecisionEnum'
          readOnly: true
        note:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attestor_name
      - capacity
      - capacity_display
      - created_at
      - decision
      - id
      - note
    AttestationDecisionEnum:
      enum:
      - confirm
      - dispute
      type: string
      description: |-
        * `confirm` - Confirmed
        * `dispute` - Disputed
    AvailabilityEnum:
      enum:
      - open
      - limited
      - paused
      type: string
      description: |-
        * `open` - Accepting requests
        * `limited` - At capacity
        * `paused` - Not available at the moment
    Badge:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 60
        slug:
          type: string
          maxLength: 60
          pattern: ^[-a-zA-Z0-9_]+$
        kind:
          $ref: '#/components/schemas/BadgeKindEnum'
        description:
          type: string
          maxLength: 240
        criteria:
          type: string
          description: Published on the badge. Say exactly how it is earned.
          maxLength: 300
        icon:
          type: string
          maxLength: 40
      required:
      - criteria
      - description
      - id
      - name
      - slug
    BadgeKindEnum:
      enum:
      - milestone
      - craft
      - community
      - stewardship
      type: string
      description: |-
        * `milestone` - Milestone
        * `craft` - Craft
        * `community` - Community
        * `stewardship` - Stewardship
    BlankEnum:
      enum:
      - ''
    CapacityEnum:
      enum:
      - lead
      - mentor
      - peer
      - community_lead
      type: string
      description: |-
        * `lead` - Project lead
        * `mentor` - Mentor
        * `peer` - Peer reviewer
        * `community_lead` - Community lead
    Certificate:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/CertificateKindEnum'
          readOnly: true
        kind_display:
          type: string
          readOnly: true
        project_title:
          type: string
          readOnly: true
        recipient_name:
          type: string
          readOnly: true
        statement:
          type: string
          readOnly: true
        verification_code:
          type: string
          readOnly: true
        ledger_head:
          type: string
          readOnly: true
          description: The ledger hash at the moment of issue, tying the certificate
