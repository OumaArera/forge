      - off_topic
      - privacy
      - other
      type: string
      description: |-
        * `harassment` - Harassment or abuse
        * `academic_dishonesty` - Academic dishonesty
        * `misattribution` - Passing off another's work as one's own
        * `unsafe_security` - Unsafe or unlawful security activity
        * `spam` - Spam or advertising
        * `off_topic` - Off topic or low quality
        * `privacy` - Personal data shared without consent
        * `other` - Something else
    RegistrationRequest:
      type: object
      description: |-
        Joining FORGE.

        There is deliberately no password field. Credentials are generated and
        emailed to the University address, so opening an account requires being
        able to read that mailbox. Letting people choose their own password would
        mean anyone who can guess the shape of a University address can create a
        working account without ever proving they hold it.
      properties:
        email:
          type: string
          format: email
          minLength: 1
        full_name:
          type: string
          minLength: 1
          maxLength: 160
        recovery_email:
          type: string
          format: email
          description: Optional now, and you can add it later. Your University address
            stops working when you graduate; your portfolio does not.
        programme_id:
          type: string
          format: uuid
          nullable: true
        year_of_study:
          type: integer
          maximum: 9
          minimum: 1
          nullable: true
        public_slug:
