        '200':
          description: No response body
  /api/v1/accounts/me/recovery-email/:
    post:
      operationId: accounts_me_recovery_email_create
      description: |-
        Add, replace or withdraw the personal address on an account.

        POST starts confirmation of a new address; DELETE abandons a pending one.
        The address is not promoted to `recovery_email` until the link is followed,
        and `pending_recovery_email` is what the interface shows in the meantime --
        without it, submitting the form appeared to do nothing at all.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRecoveryEmailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetRecoveryEmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetRecoveryEmailRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    delete:
      operationId: accounts_me_recovery_email_destroy
      description: |-
        Add, replace or withdraw the personal address on an account.

        POST starts confirmation of a new address; DELETE abandons a pending one.
        The address is not promoted to `recovery_email` until the link is followed,
        and `pending_recovery_email` is what the interface shows in the meantime --
        without it, submitting the form appeared to do nothing at all.
      tags:
      - accounts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/accounts/me/recovery-email/resend/:
    post:
      operationId: accounts_me_recovery_email_resend_create
      description: Send the confirmation link again for an address already pending.
      tags:
      - accounts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '202':
          description: No response body
  /api/v1/accounts/members/:
    get:
      operationId: accounts_members_list
      description: Browsing members. Read-only, and email addresses never appear.
      parameters:
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - alumnus
          - external
          - staff
          - student
        description: |-
