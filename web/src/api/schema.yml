    PatchedContributionRequest:
      type: object
      properties:
        project:
          type: string
          format: uuid
        dimension:
          $ref: '#/components/schemas/DimensionEnum'
        description:
          type: string
          minLength: 1
          description: What you did, specifically enough that your lead and mentor
            can recognise it. 'Worked on the backend' is not a contribution record;
            'built and tested the contribution ledger, including the hash chain' is.
          maxLength: 2000
        evidence_url:
          type: string
          format: uri
          description: 'A link to the work itself: a commit, a pull request, a document,
            a recording. Optional but it makes confirmation quick.'
          maxLength: 200
        effort_hours:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,1})?$
          nullable: true
          description: Approximate. Used for your own record, not for ranking.
        occurred_on:
          type: string
          format: date
        milestone:
          type: string
          format: uuid
          nullable: true
        skill_ids:
          type: array
          items:
            type: string
            format: uuid
            writeOnly: true
          writeOnly: true
        ai_assistance:
          $ref: '#/components/schemas/AiAssistanceEnum'
        ai_assistance_note:
          type: string
          maxLength: 300
    PatchedMeRequest:
      type: object
      description: The signed-in member's own record, including private fields.
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 160
        preferred_name:
          type: string
          maxLength: 80
        public_slug:
          type: string
          minLength: 1
          description: 'The stable address of your public portfolio. Choose carefully:
            changing it breaks links you have already shared.'
          pattern: ^[a-z0-9]([a-z0-9-]{1,38}[a-z0-9])$
          maxLength: 40
        headline:
          type: string
          maxLength: 140
        bio:
          type: string
          maxLength: 2000
        location:
          type: string
          description: County or town. Optional, and never finer than that.
          maxLength: 80
        links:
          description: 'Optional: {"github": "...", "linkedin": "...", "site": "..."}'
        avatar:
          type: string
          format: binary
          nullable: true
        year_of_study:
          type: integer
          maximum: 9
          minimum: 1
          nullable: true
        portfolio_is_public:
          type: boolean
          description: A public portfolio is the point of FORGE, but it remains your
            choice. Turning this off hides the public page; it does not delete anything.
        show_email_on_portfolio:
          type: boolean
        accepted_conduct_at:
          type: string
          format: date-time
          nullable: true
    PatchedMentorProfileRequest:
      type: object
      properties:
        headline:
          type: string
          minLength: 1
          maxLength: 160
        about:
          type: string
          minLength: 1
          maxLength: 2000
        capacity:
          type: integer
          maximum: 20
          minimum: 0
          description: How many projects you are willing to mentor at once. Set this
            honestly and low. Nobody is served by a mentor who has agreed to more
            than they can do.
        availability:
          $ref: '#/components/schemas/AvailabilityEnum'
        hours_per_month:
          type: integer
          maximum: 200
          minimum: 0
          nullable: true
          description: Indicative. Shown to students so they ask for a realistic amount.
        is_alumnus:
          type: boolean
        organisation:
          type: string
          maxLength: 160
    PatchedMentorshipRequestRequest:
      type: object
      properties:
        mentor_id:
          type: string
          format: uuid
          writeOnly: true
        project:
          type: string
          format: uuid
          nullable: true
        message:
          type: string
          minLength: 1
          description: What you are working on and what you would like help with.
            A specific ask gets a reply; 'be my mentor' usually does not.
          maxLength: 1500
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Requests lapse rather than sitting unanswered forever. A student
            left waiting with no answer concludes the platform is dead.
