        schema:
          type: integer
      - in: query
        name: programme
        schema:
          type: string
          format: uuid
      - in: query
        name: school
        schema:
          type: string
          format: uuid
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - accounts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicUserList'
          description: ''
  /api/v1/accounts/members/{public_slug}/:
