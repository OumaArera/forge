{% comment %}A bulletproof-ish button. Included by the templates that need one.{% endcomment %}
<tr>
  <td style="padding:8px 28px 4px;">
    <table role="presentation" cellpadding="0" cellspacing="0">
      <tr>
        <td style="background:#1f6fe5;border-radius:8px;">
          <a href="{{ action_url }}"
             style="display:inline-block;padding:13px 26px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;">
            {{ action_label }}
          </a>
        </td>
      </tr>
    </table>
    <p style="margin:14px 0 0;font-size:12px;color:#64748b;word-break:break-all;">
      Or paste this into your browser:<br />{{ action_url }}
    </p>
  </td>
</tr>
